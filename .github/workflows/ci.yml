name: CI Pipeline

on:
  push:
    branches:
      - main
      - release-candidate
  pull_request:
    branches:
      - main
      - release-candidate

jobs:
  server-tests:
    name: Backend Tests & Audit
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Syntax Check Server Code
        run: |
          cd server
          node --check server.js
          node --check controllers/authController.js
          node --check controllers/orderController.js
          node --check controllers/menuController.js
          node --check controllers/uploadController.js

      - name: Run Server Unit & Integration Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/aura_test
          JWT_SECRET: ci_test_jwt_secret_key_aura_2026_ci_runner
          TABLE_QR_SECRET: ci_test_table_qr_secret_2026_ci_runner
        run: |
          cd server
          npm test -- --runInBand --forceExit

      - name: Security Audit Server Packages
        run: |
          cd server
          npm audit --audit-level=high || true

  client-check:
    name: Client Bundling & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Client Dependencies
        run: npm ci

      - name: Export Metro Bundle (Android Verification)
        run: npx expo export -p android --no-minify

