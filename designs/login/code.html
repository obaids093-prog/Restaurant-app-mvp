<div class="absolute -top-16 left-1/2 -translate-x-1/2 w-72 h-72 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 -right-24 w-56 h-56 bg-primary-container/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Hero Branding -->
<div class="flex flex-col items-center justify-center pt-space-lg pb-space-md text-center relative z-10">
<div class="relative w-20 h-20 mb-space-sm flex items-center justify-center">
<div class="absolute inset-0 bg-primary-container/15 rounded-full blur-md"></div>
<img alt="AURA Golden Botanical Logo" class="w-20 h-20 object-contain relative z-10 drop-shadow-md" src="https://lh3.googleusercontent.com/aida/AEtjO1WN4z4tONBU-ny2lmE_RM4JSEJ2wBxutfqlBHYZnAITSgtTkB6HfcOIiobHZvA1Dp7jzRuHm-dkUMwxFOXJoYpG-eAK-VQfIAGZ018aq8WtlfAh7DOj8Y-fyHCrDCy0vxbJJAC2jTY2IUAcPjwYCXIwuq9r3-ISxET1-MmLzTQjuIc2gFcXwjsah9z1wqNDTyr-uDSmth2NSW6YB703DQL-jLyyRtdR5wLqHGLzcYYn"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-wide">AURA</h1>
<p class="font-label-sm text-label-sm text-primary-fixed-dim uppercase tracking-[0.25em] mt-1">
      Modern Artisan Kitchen &amp; Botanica
    </p>
</div>
<!-- Role Switcher Segmented Pill -->
<div class="w-full max-w-sm mx-auto mb-space-lg relative z-10">
<div class="relative flex items-center bg-surface-container-low p-1 rounded-full shadow-inner">
<!-- Sliding Background Indicator -->
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-gradient-to-r from-primary-container to-primary rounded-full transition-transform duration-300 ease-out shadow-md" id="role-indicator"></div>
<!-- Role Buttons -->
<button class="relative flex-1 py-2 text-center rounded-full z-10 transition-colors duration-200" id="btn-customer" onclick="switchRole('customer')" type="button">
<span class="font-label-md text-label-md font-semibold text-on-primary" id="text-customer">Customer Dining</span>
</button>
<button class="relative flex-1 py-2 text-center rounded-full z-10 transition-colors duration-200" id="btn-manager" onclick="switchRole('manager')" type="button">
<span class="font-label-md text-label-md font-medium text-on-surface-variant" id="text-manager">Restaurant Manager</span>
</button>
</div>
</div>
<!-- Main Login Card Container -->
<div class="w-full max-w-sm mx-auto bg-surface-container/70 backdrop-blur-xl rounded-xl p-space-md shadow-xl relative z-10 space-y-space-md">
<!-- Role Context Subtitle -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant" id="role-hint">
        Access your bespoke reservations &amp; tasting diary
      </p>
</div>
<!-- Credentials Form -->
<div class="space-y-space-sm">
<!-- Input: Email / VIP ID -->
<div class="space-y-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="identifier">
          Identity
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-primary text-lg pointer-events-none select-none">
            mail
          </span>
<input autocomplete="email" class="w-full h-12 bg-surface-container-lowest/80 text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md pl-11 pr-4 rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-all" id="identifier" name="identifier" placeholder="VIP Pass ID or Email" type="text"/>
</div>
</div>
<!-- Input: Security Key / Password -->
<div class="space-y-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="passcode">
          Passcode
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-primary text-lg pointer-events-none select-none">
            lock
          </span>
<input autocomplete="current-password" class="w-full h-12 bg-surface-container-lowest/80 text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md pl-11 pr-11 rounded-lg focus:outline-none focus:bg-surface-container-lowest transition-all" id="passcode" name="passcode" placeholder="Security Key" type="password"/>
<button class="absolute right-3 p-1 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" id="toggle-passcode" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-lg" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Meta Row: Remember & Forgot -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center space-x-2 cursor-pointer group">
<input checked="" class="w-4 h-4 rounded bg-surface-container-lowest accent-primary cursor-pointer transition-colors" id="remember-me" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
            Remember session
          </span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:underline underline-offset-4 tracking-wide transition-all" href="#forgot">
          Forgot Key?
        </a>
</div>
</div>
<!-- High-Glow Primary CTA Button -->
<button class="w-full h-12 rounded-full bg-gradient-to-r from-primary-container to-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center space-x-2 shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-150" onclick="handleLogin()" type="button">
<span>Enter AURA</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<!-- Divider: Or Access Via -->
<div class="relative flex items-center justify-center pt-1">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container text-primary-fixed-dim font-label-sm text-label-sm uppercase tracking-widest whitespace-nowrap">
        Or Access Via
      </span>
</div>
<!-- Social Authentication Pills -->
<div class="grid grid-cols-2 gap-space-sm pt-1">
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container-high text-on-surface flex items-center justify-center space-x-2 active:scale-95 transition-all" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.6-7.79-11.74-14.25-5.99-9.35-10.74-19.8-14.25-31.35-3.51-11.55-5.27-23.01-5.27-34.39 0-13.37 3.34-24.63 10.02-33.8 6.68-9.17 15.17-13.88 25.48-14.13 5.44 0 11.39 1.57 17.86 4.71 6.46 3.14 10.51 4.76 12.13 4.86 1.85-.2 6.06-1.85 12.65-4.96 6.59-3.11 12.37-4.51 17.34-4.21 13.06.77 23.36 5.61 30.9 14.53-11.55 7.01-17.18 16.66-16.9 28.96.28 9.68 3.96 17.75 11.04 24.21 7.08 6.46 15.42 10.04 25.02 10.74-2.28 7.03-5.24 14.39-8.87 22.08zM119.22 33.15c0-7.23 2.58-14.17 7.74-20.82 5.16-6.65 11.59-10.97 19.29-12.96.2 1.34.3 2.6.3 3.79 0 7.37-2.67 14.54-8.01 21.52-5.34 6.98-11.75 11.19-19.22 12.63-.1-1.41-.1-2.79-.1-4.16z"></path>
</svg>
<span class="font-label-sm text-label-sm tracking-wide">Apple VIP</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-low hover:bg-surface-container-high text-on-surface flex items-center justify-center space-x-2 active:scale-95 transition-all" type="button">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12.24 10.285V13.4h6.887c-.286 1.77-1.954 5.185-6.887 5.185-4.148 0-7.533-3.435-7.533-7.585s3.385-7.585 7.533-7.585c2.36 0 3.935.998 4.838 1.854l2.457-2.364C17.962 1.543 15.34 0.5 12.24 0.5 5.86 0.5.69 5.67.69 12.05s5.17 11.55 11.55 11.55c6.666 0 11.096-4.686 11.096-11.294 0-.76-.08-1.336-.182-1.91h-10.914z"></path>
</svg>
<span class="font-label-sm text-label-sm tracking-wide">Google Key</span>
</button>
</div>
</div>
<!-- Culinary Guild Footer -->
<div class="mt-space-md text-center max-w-xs mx-auto relative z-10">
<p class="font-label-sm text-label-sm text-on-surface-variant/70 leading-relaxed">
      By entering, you accept AURA Culinary Guild Privileges &amp; Private Dining Charter.
    </p>
</div>
</div>
<script>
  let currentRole = 'customer';

  function switchRole(role) {
    currentRole = role;
    const indicator = document.getElementById('role-indicator');
    const textCustomer = document.getElementById('text-customer');
    const textManager = document.getElementById('text-manager');
    const roleHint = document.getElementById('role-hint');
    const idInput = document.getElementById('identifier');

    if (role === 'customer') {
      indicator.style.transform = 'translateX(0%)';
      textCustomer.className = 'font-label-md text-label-md font-semibold text-on-primary';
      textManager.className = 'font-label-md text-label-md font-medium text-on-surface-variant';
      roleHint.textContent = 'Access your bespoke reservations & tasting diary';
      idInput.placeholder = 'VIP Pass ID or Email';
    } else {
      indicator.style.transform = 'translateX(100%)';
      textManager.className = 'font-label-md text-label-md font-semibold text-on-primary';
      textCustomer.className = 'font-label-md text-label-md font-medium text-on-surface-variant';
      roleHint.textContent = 'Direct kitchen pass, cellar ledger & shift orchestration';
      idInput.placeholder = 'Sommelier or Executive Badge ID';
    }
  }

  function togglePasswordVisibility() {
    const passInput = document.getElementById('passcode');
    const eyeIcon = document.getElementById('eye-icon');
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const idInput = document.getElementById('identifier');
    const passcode = document.getElementById('passcode');
    if (!idInput.value.trim()) {
      idInput.focus();
      return;
    }
    if (!passcode.value.trim()) {
      passcode.focus();
      return;
    }
  }
</script></main></body></html>
