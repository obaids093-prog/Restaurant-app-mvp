<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login and Sign up - Light Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      -webkit-font-smoothing: antialiased;
    }
    .serif-brand {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-[#1e1e1e] min-h-[844px] w-[390px] mx-auto flex flex-col justify-between relative shadow-2xl overflow-hidden">

  <!-- TOP PRIMARY CURVED HEADER WITH LOGO -->
  <div class="relative bg-[#fc5834] text-white pt-10 pb-16 px-6 rounded-b-[36px] shadow-lg shadow-[#fc5834]/20 flex flex-col items-center">
    <!-- Top System Time / Status bar spacing -->
    <div class="w-full flex items-center justify-between text-xs font-semibold text-white/90 mb-4 px-1">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <div class="flex gap-0.5 items-end h-3">
          <span class="w-1 h-1.5 bg-white rounded-xs"></span>
          <span class="w-1 h-2 bg-white rounded-xs"></span>
          <span class="w-1 h-2.5 bg-white rounded-xs"></span>
          <span class="w-1 h-3 bg-white rounded-xs"></span>
        </div>
        <div class="w-4 h-2 border border-white/80 rounded-xs p-0.5">
          <div class="h-full w-full bg-white"></div>
        </div>
      </div>
    </div>

    <!-- Curved Header Branding -->
    <div class="w-14 h-14 rounded-2xl bg-white text-[#fc5834] flex items-center justify-center shadow-md mb-2.5">
      <svg class="w-8 h-8" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 6v4" />
        <path d="M10 28c0-7.732 6.268-14 14-14s14 6.268 14 14H10z" stroke-width="2.5" />
        <path d="M8 32h32" stroke-width="2.5" />
        <path d="M12 36h24" stroke-width="2.5" />
        <circle cx="24" cy="6" r="2" fill="currentColor" />
      </svg>
    </div>
    
    <h1 class="serif-brand text-2xl font-bold tracking-[0.2em] uppercase text-white mb-0.5">AURA</h1>
    <p class="text-[11px] font-medium tracking-wider uppercase text-white/85">Artisan Kitchen Concierge</p>

    <!-- Subtle Decorative Background Circles -->
    <div class="absolute -top-10 -right-10 w-36 h-36 rounded-full bg-white/10 pointer-events-none"></div>
    <div class="absolute bottom-2 -left-8 w-24 h-24 rounded-full bg-white/10 pointer-events-none"></div>
  </div>

  <!-- MAIN AUTH CONTAINER CARD -->
  <div class="flex-1 px-5 -mt-8 z-10 flex flex-col justify-between pb-6">
    <div class="bg-white rounded-[24px] p-6 shadow-xl shadow-black/5 border border-gray-100 flex flex-col">
      
      <!-- SEGMENTED CONTROL: LOGIN / SIGN UP -->
      <div class="bg-[#f3f4f6] p-1 rounded-xl flex items-center mb-6">
        <button class="flex-1 py-2.5 text-center text-sm font-semibold rounded-lg bg-white text-[#fc5834] shadow-sm transition-all">
          Login
        </button>
        <button class="flex-1 py-2.5 text-center text-sm font-medium rounded-lg text-gray-500 hover:text-gray-900 transition-all">
          Sign Up
        </button>
      </div>

      <!-- FORM FIELDS -->
      <form class="space-y-4" onsubmit="return false;">
        <!-- EMAIL INPUT -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1.5">
            Email Address
          </label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-gray-400">
              <!-- Mail Icon -->
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
              </svg>
            </span>
            <input 
              type="email" 
              value="zainab.malik@aurahospitality.pk"
              class="w-full pl-11 pr-4 py-3 bg-[#fbfbfc] border border-gray-200 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:border-[#fc5834] transition-colors"
              placeholder="Enter your email"
            />
          </div>
        </div>

        <!-- PASSWORD INPUT (WITH INLINE ERROR STATE) -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600">
              Password
            </label>
            <a href="#" class="text-xs font-medium text-[#fc5834] hover:underline">
              Forgot?
            </a>
          </div>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-red-500">
              <!-- Lock Icon -->
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input 
              type="password" 
              value="••••••••••••"
              class="w-full pl-11 pr-11 py-3 bg-red-50/40 border border-red-500 rounded-xl text-sm font-medium text-gray-800 focus:outline-none focus:ring-1 focus:ring-red-500 transition-colors"
              placeholder="Enter password"
            />
            <!-- Show / Hide Icon Button -->
            <button type="button" class="absolute right-3.5 text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
          <!-- INLINE ERROR STATE PER USER REQUIREMENT -->
          <div class="flex items-center gap-1.5 mt-2 text-xs font-medium text-red-600">
            <svg class="w-4 h-4 shrink-0 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Invalid email or password</span>
          </div>
        </div>

        <!-- LARGE PRIMARY CTA BUTTON -->
        <div class="pt-2">
          <button type="button" class="w-full py-3.5 bg-[#fc5834] hover:bg-[#e04a27] text-white font-semibold text-base rounded-xl shadow-lg shadow-[#fc5834]/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
            <span>Sign In to AURA</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </form>

      <!-- DIVIDER -->
      <div class="relative my-5 text-center">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <span class="relative bg-white px-3 text-xs text-gray-400 font-medium uppercase tracking-wider">
          or
        </span>
      </div>

      <!-- CONTINUE WITH PHONE NUMBER LINK (NO SOCIAL LOGINS) -->
      <button class="w-full py-3 bg-[#f8f9fa] hover:bg-gray-100 border border-gray-200/90 rounded-xl text-sm font-semibold text-gray-800 flex items-center justify-center gap-2.5 transition-colors">
        <!-- Phone outline icon -->
        <svg class="w-4 h-4 text-[#fc5834]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        <span>Continue with phone number</span>
      </button>

      <!-- SMALL SIGN UP LINK -->
      <div class="mt-5 text-center">
        <p class="text-xs text-gray-500 font-medium">
          Don't have an account? 
          <a href="#" class="font-bold text-[#fc5834] hover:underline ml-0.5">Sign up</a>
        </p>
      </div>

    </div>

    <!-- PRIVACY & POLICY FOOTNOTE -->
    <div class="text-center pt-4">
      <p class="text-[11px] text-gray-400">
        By continuing, you agree to AURA's <a href="#" class="underline">Terms of Dining</a> and <a href="#" class="underline">Privacy Promise</a>.
      </p>
      <!-- Home bar indicator -->
      <div class="w-32 h-1 bg-gray-300 rounded-full mx-auto mt-3"></div>
    </div>
  </div>

</body>
</html>
