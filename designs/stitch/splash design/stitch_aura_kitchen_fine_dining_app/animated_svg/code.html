<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_65 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_65" style="display:block;"><svg class="w-full h-full" fill="none" viewbox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="auraGold" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"></stop>
<stop offset="50%" stop-color="#FFE8DF"></stop>
<stop offset="100%" stop-color="#FC5834"></stop>
</lineargradient>
<filter height="140%" id="glow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="3"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<style>
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseCloche {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }
    @keyframes floatSteam {
      0% { opacity: 0; transform: translateY(4px) scale(0.8); }
      50% { opacity: 0.9; transform: translateY(-3px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-10px) scale(1.3); }
    }
    @keyframes shimmerStroke {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .ring-outer {
      transform-origin: 80px 80px;
      animation: rotateRing 18s linear infinite;
    }
    .cloche-group {
      transform-origin: 80px 85px;
      animation: pulseCloche 3.5s ease-in-out infinite;
    }
    .steam-1 {
      transform-origin: 72px 55px;
      animation: floatSteam 2.5s ease-in-out infinite;
    }
    .steam-2 {
      transform-origin: 80px 50px;
      animation: floatSteam 2.5s ease-in-out 0.8s infinite;
    }
    .steam-3 {
      transform-origin: 88px 55px;
      animation: floatSteam 2.5s ease-in-out 1.6s infinite;
    }
    .shimmer-ring {
      stroke-dasharray: 20 15;
      animation: shimmerStroke 12s linear infinite;
    }
  </style>
<!-- Glowing outer ambient circle -->
<circle class="ring-outer" cx="80" cy="80" r="72" stroke="rgba(255,255,255,0.2)" stroke-dasharray="4 8" stroke-width="1.5"></circle>
<circle class="shimmer-ring" cx="80" cy="80" r="62" stroke="rgba(255,255,255,0.35)" stroke-width="2"></circle>
<!-- Botanical Laurel Accents -->
<g class="ring-outer" opacity="0.75">
<path d="M 80 14 C 76 22, 73 28, 80 34 C 87 28, 84 22, 80 14 Z" fill="white" opacity="0.8"></path>
<path d="M 146 80 C 138 76, 132 73, 126 80 C 132 87, 138 84, 146 80 Z" fill="white" opacity="0.8"></path>
<path d="M 80 146 C 84 138, 87 132, 80 126 C 73 132, 76 138, 80 146 Z" fill="white" opacity="0.8"></path>
<path d="M 14 80 C 22 84, 28 87, 34 80 C 28 73, 22 76, 14 80 Z" fill="white" opacity="0.8"></path>
</g>
<!-- Steam Essence -->
<path class="steam-1" d="M 72 58 C 70 54, 74 50, 72 46" stroke="white" stroke-linecap="round" stroke-width="2"></path>
<path class="steam-2" d="M 80 54 C 78 49, 82 45, 80 40" stroke="white" stroke-linecap="round" stroke-width="2.5"></path>
<path class="steam-3" d="M 88 58 C 86 54, 90 50, 88 46" stroke="white" stroke-linecap="round" stroke-width="2"></path>
<!-- Cloche Icon -->
<g class="cloche-group" filter="url(#glow)">
<!-- Cloche handle top bead -->
<circle cx="80" cy="65" fill="white" r="4.5"></circle>
<!-- Cloche dome -->
<path d="M 50 94 C 50 74, 63 68, 80 68 C 97 68, 110 74, 110 94 Z" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"></path>
<!-- Cloche platter plate -->
<path d="M 42 100 C 54 99, 106 99, 118 100" stroke="white" stroke-linecap="round" stroke-width="4.5"></path>
<path d="M 54 106 L 106 106" opacity="0.9" stroke="white" stroke-linecap="round" stroke-width="3"></path>
<!-- Fine inner highlight rim -->
<path d="M 56 92 C 57 80, 68 74, 80 74" fill="none" stroke="rgba(255,255,255,0.7)" stroke-linecap="round" stroke-width="2"></path>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_65 -->
</body>
</html>
