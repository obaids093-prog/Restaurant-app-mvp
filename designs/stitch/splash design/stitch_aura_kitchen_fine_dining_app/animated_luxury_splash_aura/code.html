    body {

    /* Text Shimmer Effect */
    .shimmer-text {
      background: linear-gradient(135deg, #ffffff 0%, #fff0e8 35%, #ffd2be 60%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* Staggered Entrance Animations */
    .fade-up-1 {
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }
    .fade-up-2 {

    }
    .fade-up-3 {

    .fade-up-bottom {
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Progress Bar Shimmer */
    .progress-fill {
      animation: progressLoad 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes progressLoad {
      0% { width: 0%; opacity: 0.6; }
      50% { width: 72%; opacity: 1; }

    }

      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }

<!-- 1. Procedural WebGL Shader Background -->
<!-- STITCH_SHADER_START:ANIMATION_64 class="absolute inset-0 w-full h-full pointer-events-none" -->
<div class="absolute inset-0 w-full h-full pointer-events-none" style="display:block;">
<canvas id="shader-canvas-ANIMATION_64" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_64');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Subtle organic luxury liquid / botanica aura shader
void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    float t = u_time * 0.4;
    
    // Warm luxury ember & organic botanical fluid distortion
    for(float i = 1.0; i < 4.0; i++) {
        p.x += 0.3 / i * sin(i * 3.0 * p.y + t + sin(p.x * 2.0));
        p.y += 0.3 / i * cos(i * 3.0 * p.x + t * 0.8 + cos(p.y * 2.0));
    }
    
    float d = length(p);
    
    // Brand primary: #FC5834 -> vec3(0.988, 0.345, 0.204)
    // Deep crimson/burgundy: #8B1A00 -> vec3(0.545, 0.102, 0.0)
    // Warm glowing amber: #FFA048 -> vec3(1.0, 0.627, 0.282)
    // Dark luxury wine: #3D0800 -> vec3(0.239, 0.031, 0.0)
    
    vec3 c1 = vec3(0.988, 0.345, 0.204); // #FC5834
    vec3 c2 = vec3(0.55, 0.11, 0.03);   // Deep wine
    vec3 c3 = vec3(1.0, 0.65, 0.32);   // Golden glow
    
    float wave = sin(p.x * 2.5 + p.y * 1.5 + t);
    vec3 col = mix(c1, c2, smoothstep(-0.8, 0.8, wave));
    col = mix(col, c3, smoothstep(0.4, 1.2, sin(d * 3.0 - t * 1.5)) * 0.35);
    
    // Vignette
    float vig = smoothstep(1.8, 0.2, length(uv - 0.5) * 2.0);
    col *= (0.75 + 0.25 * vig);

    gl_FragColor = vec4(col, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
